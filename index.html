async function sendToMT4(result, setMsg){

    else if(raw.includes("BTC")) sym="BTCUSDm";
    else if(raw.includes("US30")) sym="US30m";
    else if(raw.includes("NAS") || raw.includes("USTEC")) sym="USTECm";
    else if(raw.includes("1HZ15V")) sym="1HZ15V";
    else if(raw.includes("1HZ25V")) sym="1HZ25V";
    else if(raw.includes("1HZ90V")) sym="1HZ90V";
    else if(raw.includes("1HZ100V")) sym="1HZ100V";
    else if(raw.includes("BOOM150N")) sym="BOOM150N";
    else if(raw.includes("BOOM500")) sym="BOOM500";
    else if(raw.includes("BOOM900")) sym="BOOM900";
    else if(raw.includes("BOOM1000")) sym="BOOM1000";
    else if(raw.includes("BOOM300N")) sym="BOOM300N";
    else if(raw.includes("BOOM50")) sym="BOOM50";
    else if(raw.includes("CRASH150N")) sym="CRASH150N";
    else if(raw.includes("CRASH500")) sym="CRASH500";
    else if(raw.includes("CRASH600")) sym="CRASH600";
    else if(raw.includes("CRASH900")) sym="CRASH900";
    else if(raw.includes("CRASH1000")) sym="CRASH1000";
    else if(raw.includes("CRASH300N")) sym="CRASH300N";
    else if(raw.includes("EURUSD")) sym="EURUSDm";
    else if(raw.includes("GBPUSD")) sym="GBPUSDm";

    else if(raw.includes("GBPJPY")) sym="GBPJPYm";

const sDay=e=>new Date(e*1000).toISOString().slice(0,10);
const sHour=e=>new Date(e*1000).getUTCHours();
const sMin=e=>new Date(e*1000).getUTCMinutes();

function calcRSI(cs,idx,p=3){ if(!cs||idx<p) return 50; let g=0,l=0; for(let i=1;i<=p;i++){const ch=cs[i].close-cs[i-1].close; if(ch>0)g+=ch; if(ch<0)l+=Math.abs(ch);} let ag=g/p,al=l/p; for(let i=p+1;i<=idx;i++){const ch=cs[i].close-cs[i-1].close; ag=(ag*(p-1)+Math.max(ch,0))/p; al=(al*(p-1)+Math.max(-ch,0))/p;} if(al===0) return ag===0?50:100; if(ag===0) return 0; return 100-100/(1+ag/al); }

function detectRBDDBR(cs){
  if(!cs || cs.length<12) return null;
  const recent = cs.slice(-12);
  for(let baseEnd = recent.length-2; baseEnd >= 5; baseEnd--){
    const baseCandles = recent.slice(baseEnd-4, baseEnd+1);
    const baseHigh = Math.max(...baseCandles.map(c=>c.high));
    const baseLow = Math.min(...baseCandles.map(c=>c.low));
    const baseRange = baseHigh - baseLow;
    if(baseRange<=0) continue;
    const avgBody = baseCandles.reduce((s,c)=>s+Math.abs(c.close-c.open),0)/baseCandles.length;
    if(avgBody > baseRange*0.55) continue;
    const legCandles = recent.slice(Math.max(0, baseEnd-7), baseEnd-4);
    if(legCandles.length<3) continue;
    const legOpen = legCandles[0].open; const legClose = legCandles[legCandles.length-1].close;
    const legSize = Math.abs(legClose - legOpen);
    if(legSize < baseRange*1.2) continue;
    const impulse = recent[baseEnd+1]; const last = recent[recent.length-1];
    if(!impulse) continue;
    if(legClose > legOpen){
      if(impulse.close < baseLow && cColor(impulse)==="RED"){
        if(last.high >= baseLow && last.high <= baseHigh + baseRange*0.2) return {dir:"SELL", strat:"RBD - SELL AT BASE", entry:baseHigh, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:`Rally -> Base -> Drop -> Retest`};
        if(last.close < baseLow) return {dir:"SELL", strat:"RBD - SELL AT BASE (WAIT RETEST)", entry:baseHigh, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:"Rally-Base-Drop confirmed"};
      }
    }
    if(legClose < legOpen){
      if(impulse.close > baseHigh && cColor(impulse)==="GREEN"){
        if(last.low <= baseHigh && last.low >= baseLow - baseRange*0.2) return {dir:"BUY", strat:"DBR - BUY AT BASE", entry:baseLow, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:`Drop -> Base -> Rally -> Retest`};
        if(last.close > baseHigh) return {dir:"BUY", strat:"DBR - BUY AT BASE (WAIT RETEST)", entry:baseLow, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:"Drop-Base-Rally confirmed"};
      }
    }
  }
  return null;
}

       if(txt.includes("EURUSD")||txt.includes("EUR")) return {pair:"EURUSD", price};
       if(txt.includes("GBPUSD")) return {pair:"GBPUSD", price};
       if(txt.includes("USDJPY")||txt.includes("JPY")&&price&&price>140&&price<170) return {pair:"USDJPY", price};
       if(price){
         if(price>3500 && price<5500) return {pair:"XAUUSD", price};
         if(price>90000) return {pair:"BTCUSD", price};
         if(price>40000 && price<60000) return {pair:"US30", price};

         if(price>0.6 && price<0.7) return {pair:"AUDUSD", price};
         if(price>1.0 && price<1.2) return {pair:"EURUSD", price};

       }

 function analyzeImageTrend(url){
   return new Promise(res=>{
     const img=new Image(); img.src=url;
     img.onload=()=>{
       const c=document.createElement('canvas'); c.width=200; c.height=100;
       const x=c.getContext('2d'); x.drawImage(img,0,0,200,100);
       const d=x.getImageData(0,0,200,100).data;
       let g=0,r=0; let leftY=0, leftCount=0, rightY=0, rightCount=0;
       for(let yy=0;yy<100;yy++){ for(let xx=0;xx<200;xx++){ const i=(yy*200+xx)*4; const R=d[i], G=d[i+1], B=d[i+2]; const isBull = (R>180 && G>180 && B>180) || (G>R+20); const isBear = (R>150 && G<80 && B<80) || (R>G+20); if(isBull || isBear){ if(xx<66){ leftY+=yy; leftCount++; } if(xx>133){ rightY+=yy; rightCount++; } if(isBull) g++; if(isBear) r++; } } }
       const leftAvg = leftCount? leftY/leftCount : 50; const rightAvg = rightCount? rightY/rightCount : 50;
       let slopeScore = 0; if(rightAvg < leftAvg - 3) slopeScore = 15; else if(rightAvg > leftAvg + 3) slopeScore = -15;
       let colorScore = g>=r ? 10 : -10; res(slopeScore*0.6 + colorScore*0.4);
     };
     img.onerror=()=>res(0);
   });
 }

               <div style={{background:"#1e293b",padding:7,borderRadius:6}}><div style={{fontSize:9,color:"#fbbf24"}}>TAKE PROFIT</div><b style={{color:"#4ade80",fontSize:13}}>{fmtPrice(result.tp, result.pair)}</b></div>
             </div>
             <button onClick={()=>sendToMT4(result,setMsg)} style={{width:"100%",padding:12,marginTop:8,background:"#f59e0b",color:"black",border:"none",borderRadius:8,fontWeight:900,fontSize:13}}>🚀 SEND TO MT4 - AUTO TRADE</button>
             <div style={{fontSize:11,color:"#4ade80",textAlign:"center",marginTop:6}}>{msg}</div>
           </div>
         )}
       </div>
     )}
     {!showScanner && result && (
       <div style={{display:"flex",justifyContent:"space-between",background:"#0f172a",border:"1px solid #22c55e",borderRadius:8,padding:8,marginTop:8}}><b>{result.pair} {result.dir} @ {fmtPrice(result.entry,result.pair)}</b><b style={{color:"#4ade80"}}>TP {fmtPrice(result.tp,result.pair)}</b></div>
     )}
   </div>
   <div style={{background:"#131e32",border:"1px solid #24334b",borderRadius:10,margin:"0 10px",padding:"8px 10px"}}>
     <button onClick={()=>setShowSignals(v=>!v)} style={{width:"100%",display:"flex",justifyContent:"space-between",background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:6,padding:8,fontSize:11,fontWeight:900}}><span>SIGNALS ({signals.length})</span><span>{showSignals?"▲":"▼"}</span></button>
     {showSignals && signals.map((s,i)=>(
       <div key={i} style={{background:"#0f172a",border:"1px solid #334155",borderRadius:8,padding:8,marginTop:6}}>
         <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}><b>{s.sym}</b><span style={{color:s.dir==="BUY"?"#4ade80":"#f87171",fontWeight:900}}>{s.dir} {s.strat}</span></div>
         <button onClick={()=>placeOrder(s)} style={{width:"100%",padding:8,marginTop:6,background:"#f59e0b",color:"black",border:"none",borderRadius:6,fontWeight:900,fontSize:11}}>PLACE {s.dir==="BUY"?"BUY STOP":"SELL STOP"} 🔔</button>
       </div>
     ))}
   </div>

   <div style={{background:"#131e32",border:"1px solid #d4af37",borderRadius:12,margin:"8px 10px",padding:"10px"}}>
     <button onClick={()=>setShowLic(v=>!v)} style={{width:"100%",display:"flex",justifyContent:"space-between",background:"transparent",color:"#FFD700",border:"none",padding:0,fontSize:12,fontWeight:900,textAlign:"left"}}><span>👑 {DISPLAY_NAME.toUpperCase()} LICENSE CONTROL</span><span>{showLic?"▲":"▼"}</span></button>
     {showLic && (
       <div>
         <div style={{fontSize:10,color:"#8a9bb5",marginTop:6}}>Manage EA licenses from your phone.</div>
         {licenseList.map((l,i)=>(
           <div key={i} style={{display:"flex",justifyContent:"space-between",background:"#0f172a",padding:"7px",borderRadius:6,marginTop:6,fontSize:11}}>
             <span>Acc: <b>{l.account}</b> - Exp: {l.expiry}</span>
             <span style={{color:"#FFD700",fontWeight:800}}>{l.status}</span>
           </div>
         ))}
         <div style={{display:"flex",gap:6,marginTop:8}}>
           <input value={newLicAcc} onChange={e=>setNewLicAcc(e.target.value)} placeholder="Client MT4 account" style={{flex:1,background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:6,padding:7,fontSize:11}} />
           <input value={newLicExp} onChange={e=>setNewLicExp(e.target.value)} placeholder="2027.12.31" style={{width:90,background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:6,padding:7,fontSize:11}} />
         </div>
         <button onClick={async()=>{
           if(!newLicAcc) return;
           const chk = await checkLicenseServer(newLicAcc);
           setLicenseList(p=>[...p, {account:newLicAcc, expiry:newLicExp, status: chk.ok?"ACTIVE ✅":"NOT ACTIVE - Contact Smamkele"}]);
           setNewLicAcc("");
         }} className="gold-btn" style={{width:"100%",padding:10,marginTop:8,border:"none",borderRadius:8,fontWeight:900,fontSize:12}}>ADD / CHECK CLIENT LICENSE</button>
         <button onClick={async()=>{
           const j = await checkLicenseServer(KING_ACCOUNT);
           alert(DISPLAY_NAME+": "+(j.ok?"License Active ✅":"Check failed"));
         }} style={{width:"100%",padding:9,marginTop:6,background:"#0ea5e9",color:"white",border:"none",borderRadius:8,fontWeight:800,fontSize:11}}>TEST MY LICENSE</button>
         <div style={{fontSize:11,color:"#4ade80",marginTop:6, textAlign:"center"}}>{licCheckMsg}</div>
       </div>
     )}
   </div>

   <div style={{textAlign:"center",fontSize:10,color:"#64748b",marginTop:6}}>UTC {new Date(clock*1000).toISOString().slice(11,19)} • Trading 07:00-21:59 • iFX BILLIONAIRE • MT4 LINKED • Logged as {DISPLAY_NAME}</div>
   <div style={{textAlign:"center",fontSize:9,letterSpacing:"2px",color:"#FFD700",fontWeight:800,marginTop:4,textTransform:"uppercase"}}>Creating More Bread Winners 👑</div>
  </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
