 function extractPriceFromText(rawTxt){
   const matches=rawTxt.match(/\d{1,3}[.,]\d{2,3}|\d{3,6}\.\d{1,3}|\d{4,6}/g)||[];
   let nums=matches.map(s=>Number(s.replace(/[ ,]/g,"").replace(",","."))).filter(n=>n>10&&n<200000);
   if(nums.length===0) return null;
   const jpy=nums.filter(n=>n>140&&n<210);
   if(jpy.length>0) return jpy[jpy.length-1];
   const golds=nums.filter(n=>n>3500&&n<5500);
   if(golds.length>0) return golds[golds.length-1];
   nums.sort((a,b)=>a-b);
   return nums[Math.floor(nums.length/2)];
 }

tton>{result&&(<div style={{background:"#0f172a",border:"1px solid #22c55e",borderRadius:8,padding:8,marginTop:8}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><b style={{fontSize:13}}>{result.pair}</b><div style={{background:result.dir==="BUY"?"#16a34a":"#dc2626",color:"white",padding:"5px 14px",borderRadius:6,fontWeight:900,fontSize:13}}>{result.dir}</div></div><div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:8,textAlign:"center"}}><div style={{background:"#1e293b",padding:7,borderRadius:6}}><div style={{fontSize:9,color:"#94a3b8"}}>ENTRY</div><b style={{fontSize:13}}>{fmtPrice(result.entry,result.pair)}</b></div><div style={{background:"#1e293b",padding:7,borderRadius:6}}><div style={{fontSize:9,color:"#94a3b8"}}>SL</div><b style={{fontSize:13}}>{fmtPrice(result.sl,result.pair)}</b></div><div style={{background:"#1e293b",padding:7,borderRadius:6}}><div style={{fontSize:9,color:"#fbbf24"}}>TAKE PROFIT</div><b style={{color:"#4ade80",fontSize:13}}>{fmtPrice(result.tp,result.pair)}</b></div></div><button onClick={()=>sendToMT4(result,setMsg)} className="confirm-pulse" style={{width:"100%",padding:14,marginTop:8,background:"#f59e0b",color:"black",border:"none",borderRadius:8,fontWeight:900,fontSize:14}}>👑 CONFIRM - SEND TO MT4 🚀</button><div style={{fontSize:11,color:"#4ade80",textAlign:"center",marginTop:6}}>{msg}</div></div>)}</div>)}</div><div style={{background:"#131e32",border:"1px solid #d4af37",borderRadius:12,margin:"8px 10px",padding:"10px"}}><button onClick={()=>setShowLic(v=>!v)} style={{width:"100%",display:"flex",justifyContent:"space-between",background:"transparent",color:"#FFD700",border:"none",padding:0,fontSize:12,fontWeight:900,textAlign:"left"}}><span>👑 {DISPLAY_NAME.toUpperCase()} LICENSE CONTROL</span><span>{showLic?"▲":"▼"}</span></button>{showLic&&(<div><div style={{fontSize:10,color:"#8a9bb5",marginTop:6}}>Manage EA licenses from your phone.</div>{licenseList.map((l,i)=>(<div
