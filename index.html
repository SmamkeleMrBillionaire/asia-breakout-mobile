const sDay=e=>new Date(e*1000).toISOString().slice(0,10);
const sHour=e=>new Date(e*1000).getUTCHours();
const sMin=e=>new Date(e*1000).getUTCMinutes();
const cColor=c=>c.close>c.open?"GREEN":c.close<c.open?"RED":"NEUTRAL";
function calcRSI(cs,idx,p=3){ if(!cs||idx<p) return 50; let g=0,l=0; for(let i=1;i<=p;i++){const ch=cs[i].close-cs[i-1].close; if(ch>0)g+=ch; if(ch<0)l+=Math.abs(ch);} let ag=g/p,al=l/p; for(let i=p+1;i<=idx;i++){const ch=cs[i].close-cs[i-1].close; ag=(ag*(p-1)+Math.max(ch,0))/p; al=(al*(p-1)+Math.max(-ch,0))/p;} if(al===0) return ag===0?50:100; if(ag===0) return 0; return 100-100/(1+ag/al); }
function buildBox(cs,day){ const f=cs.filter(c=>sDay(c.epoch)===day&&sHour(c.epoch)===0&&[0,15,30,45].includes(sMin(c.epoch))).sort((a,b)=>a.epoch-b.epoch).slice(0,4); if(f.length!==4) return null; const h=Math.max(...f.map(c=>c.high)), l=Math.min(...f.map(c=>c.low)); if(!(h>l)) return null; return {day,high:h,low:l,size:h-l,id:day+"-"+h+"-"+l}; }
function isTrading(e){ const h=sHour(e); return h>=7&&h<22; }
function detectRBDDBR(cs){
  if(!cs || cs.length<12) return null;
  const recent = cs.slice(-12);
  for(let baseEnd = recent.length-2; baseEnd >= 5; baseEnd--){
    const baseCandles = recent.slice(baseEnd-4, baseEnd+1);
    const baseHigh = Math.max(...baseCandles.map(c=>c.high));
    const baseLow = Math.min(...baseCandles.map(c=>c.low));
    const baseRange = baseHigh - baseLow;
    if(baseRange<=0) continue;
    const avgBody = baseCandles.reduce((s,c)=>s+Math.abs(c.close-c.open),0)/baseCandles.length;
    if(avgBody > baseRange*0.55) continue;
    const legCandles = recent.slice(Math.max(0, baseEnd-7), baseEnd-4);
    if(legCandles.length<3) continue;
    const legOpen = legCandles[0].open;
    const legClose = legCandles[legCandles.length-1].close;
    const legSize = Math.abs(legClose - legOpen);
    if(legSize < baseRange*1.2) continue;
    const impulse = recent[baseEnd+1];
    const last = recent[recent.length-1];
    if(!impulse) continue;
    if(legClose > legOpen){
      if(impulse.close < baseLow && cColor(impulse)==="RED"){
        if(last.high >= baseLow && last.high <= baseHigh + baseRange*0.2){
          return {dir:"SELL", strat:"RBD - SELL AT BASE", entry:baseHigh, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:`Rally -> Base -> Drop -> Retest`};
        }
        if(last.close < baseLow){
          return {dir:"SELL", strat:"RBD - SELL AT BASE (WAIT RETEST)", entry:baseHigh, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:"Rally-Base-Drop confirmed"};
        }
      }
    }
    if(legClose < legOpen){
      if(impulse.close > baseHigh && cColor(impulse)==="GREEN"){
        if(last.low <= baseHigh && last.low >= baseLow - baseRange*0.2){
          return {dir:"BUY", strat:"DBR - BUY AT BASE", entry:baseLow, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:`Drop -> Base -> Rally -> Retest`};
        }
        if(last.close > baseHigh){
          return {dir:"BUY", strat:"DBR - BUY AT BASE (WAIT RETEST)", entry:baseLow, boxHigh:baseHigh, boxLow:baseLow, baseRange, detail:"Drop-Base-Rally confirmed"};
        }
      }
    }
  }
  return null;
}

 async function detectFromImg(url,name){
   const up=(name+" ").toUpperCase();
   const syms=["XAUUSD","EURUSD","GBPUSD","BTCUSD","US30","NAS100","V75","GBPJPY","USDJPY","AUDUSD"];
   for(const s of syms) if(up.includes(s)) return {pair:s, price:null};

     const txt=raw.toUpperCase();
     const nums=(raw.match(/\d{3,6}\.\d{1,2}/g)||[]).map(Number).filter(n=>n>10);
     let price=null;
     if(nums.length>0){
       const candidates=nums.filter(n=>n>1000);
       if(candidates.length>0) price=candidates[candidates.length-1];
       if(!price && nums.length>0) price=nums[nums.length-1];
     }
     if(txt.includes("AUDUSD")||txt.includes("AUD")) return {pair:"AUDUSD", price};
     if(price && price>15000 && price<50000){
       if(price>30000 && price<42000) return {pair:"V75", price};
       if(price>42000 && price<46000) return {pair:"US30", price};
       if(price>18000 && price<25000) return {pair:"NAS100", price};
     }
     if(price && price>4000 && price<5000) return {pair:"XAUUSD", price};
     if(price && price>60000) return {pair:"BTCUSD", price};
     if(txt.includes("VOLATILITY")||txt.includes("V75")||txt.includes("V 75")||txt.includes("75 INDEX")||txt.includes("VOLATIL")) return {pair:"V75", price};
     for(const s of syms) if(txt.includes(s)) return {pair:s, price};
     if(txt.includes("GOLD")||txt.includes("XAU")) return {pair:"XAUUSD", price};
     if(txt.includes("BTC")) return {pair:"BTCUSD", price};
     if(price) return {pair:null, price};
   } }catch(e){}
   return null;
 }

 function analyzeImageTrend(url){
   return new Promise(res=>{
     const img=new Image(); img.src=url;
     img.onload=()=>{
       const c=document.createElement('canvas'); c.width=200; c.height=100;
       const x=c.getContext('2d'); x.drawImage(img,0,0,200,100);
       const d=x.getImageData(0,0,200,100).data;
       let g=0,r=0;
       let leftY=0, leftCount=0, rightY=0, rightCount=0;
       for(let yy=0;yy<100;yy++){
         for(let xx=0;xx<200;xx++){
           const i=(yy*200+xx)*4;
           const R=d[i], G=d[i+1], B=d[i+2];
           const isBull = (R>180 && G>180 && B>180) || (G>R+20);
           const isBear = (R>150 && G<80 && B<80) || (R>G+20);
           if(isBull || isBear){
             if(xx<66){ leftY+=yy; leftCount++; } 
             if(xx>133){ rightY+=yy; rightCount++; }
             if(isBull) g++; if(isBear) r++;
           }
         }
       }
       const leftAvg = leftCount? leftY/leftCount : 50;
       const rightAvg = rightCount? rightY/rightCount : 50;
       let slopeScore = 0;
       if(rightAvg < leftAvg - 3) slopeScore = 15;
       else if(rightAvg > leftAvg + 3) slopeScore = -15;
       let colorScore = g>=r ? 10 : -10;
       let total = slopeScore*0.6 + colorScore*0.4;
       res(total);
     };
     img.onerror=()=>res(0);
   });
 }

   if(rbdSignal){
     const entry=base;
     const boxSize=rbdSignal.baseRange || bs;
     const sl=rbdSignal.dir==="BUY"?entry-boxSize:entry+boxSize;
     const tp=rbdSignal.dir==="BUY"?entry+boxSize*2.2:entry-boxSize*2.2;
     setResult({pair:pair+".ecn",dir:rbdSignal.dir,entry,sl,tp,conf:88, livePrice:base, strat:rbdSignal.strat+" | "+tf1+" "+tf1Dir+" / "+tf2+" "+tf2Dir, detail:"Multi-Timeframe Enabled - "+rbdSignal.detail});
     setScanning(false); sendAlert(`iFX ${rbdSignal.strat} ${pair}`,`Entry ${fmtPrice(entry,pair)} TP ${fmtPrice(tp,pair)}`);
     return;
   }
   let dir=pixelDir;
   let conf=Math.min(92,Math.max(62,68+Math.abs(score)));
   if(t2>=10 && t1>=-10) { dir="BUY"; conf=78; }
   if(t2<=-10 && t1<=10) { dir="SELL"; conf=78; }
   const entry=base, sl=dir==="BUY"?entry-bs:entry+bs, tp=dir==="BUY"?entry+bs*2.2:entry-bs*2.2;
   setResult({pair:pair+".ecn",dir,entry,sl,tp,conf, livePrice:base, strat:"MULTI-TF | "+tf1+":"+tf1Dir+" "+tf2+":"+tf2Dir, detail:"Timeframe Alignment - M15 is boss"});
   setScanning(false); sendAlert(`iFX AI ${dir} ${pair}`,`Entry ${fmtPrice(entry,pair)} TP ${fmtPrice(tp,pair)} ${conf}%`);
 }
 const openTrades=orders.filter(o=>o.status==="OPEN"||o.status==="PENDING");
 const floating=openTrades.reduce((s,t)=>s+(t.float||0),0);
 const realised=closed.reduce((s,t)=>s+(t.pnl||0),0);
 const tradingActive=isTrading(clock);
 return (
  <div style={{maxWidth:480,margin:"0 auto",minHeight:"100vh",background:"#0a0f1a"}}>
   <div style={{padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1e2d45"}}>
     <div style={{fontSize:28,fontWeight:900}}>iFX BILLIONAIRE EA</div>
     <div style={{background:running?"#14532d":"#3a1a1a",color:running?"#4ade80":"#ff6b6b",padding:"8px 14px",borderRadius:20,fontSize:13,fontWeight:800}}>● {running?"RUNNING":"STOPPED"}</div>
   </div>
   <div style={{background:"#131e32",border:"1px solid #24334b",borderRadius:16,margin:12,padding:16}}>
     <div style={{fontSize:16,fontWeight:900}}>ROBOT CONTROL - ORANGE BOX + BREAKOUT + RBD/DBR</div>
     <div style={{display:"flex",gap:10,alignItems:"center",margin:"12px 0",justifyContent:"space-between",flexWrap:"wrap"}}>
       <span style={{color:connected?"#4ade80":"#ff6b6b",fontWeight:700,fontSize:13}}>● {connText}</span>
       <button onClick={()=>{ Notification.requestPermission(); sendAlert('TEST NOTIFICATION','Pending activation will buzz you!'); }} style={{background:"#0ea5e9",color:"white",border:"none",padding:"8px 14px",borderRadius:8,fontWeight:800,fontSize:13}}>🔔 TEST NOTIFICATION</button>
     </div>
     <div style={{display:"flex",gap:10}}>
       <button onClick={startRobot} disabled={running} style={{flex:1,padding:16,border:"none",borderRadius:10,fontWeight:900,fontSize:16,background:"#10b981",color:"white",opacity:running?0.5:1}}>▶ START ROBOT</button>
       <button onClick={stopRobot} style={{flex:1,padding:16,border:"none",borderRadius:10,fontWeight:900,fontSize:16,background:"#dc2626",color:"white"}}>■ STOP</button>
     </div>
     <div style={{fontSize:12,color:"#8a9bb5",marginTop:12}}>{msg}</div>
     <div style={{height:5,background:"#1e2d45",borderRadius:3,margin:"12px 0 8px"}}><div style={{height:"100%",background:"#3b82f6",width:`${progress}%`}} /></div>
     <div style={{fontSize:12,color:"#8a9bb5"}}>Scan: {scanned}/{total} · {progress}% · Every 5 MIN · UTC: {new Date(clock*1000).toISOString().slice(11,19)} · Last: {lastScan}</div>
     <div style={{background:tradingActive?"#14532d":"#3f1d1d",color:tradingActive?"#4ade80":"#f87171",padding:12,borderRadius:8,fontSize:14,fontWeight:800,textAlign:"center",marginTop:12}}>TRADING: {tradingActive?"ACTIVE":"PAUSED"} - 07:00 - 21:59</div>
   </div>
   <div style={{background:"#131e32",border:"1px solid #24334b",borderRadius:16,margin:12,padding:16}}>
     <div style={{display:"flex",gap:10}}>
       <div style={{flex:1}}><div style={{fontSize:12,marginBottom:4}}>Balance $</div><input type="number" value={balance} onChange={e=>setBalance(Number(e.target.value))} style={{width:"100%",background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:8,padding:10}} /></div>
       <div style={{width:90}}><div style={{fontSize:12,marginBottom:4}}>Risk %</div><input type="number" value={riskPct} onChange={e=>setRiskPct(Number(e.target.value))} style={{width:"100%",background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:8,padding:10}} /></div>
     </div>
     <div style={{marginTop:12,display:"flex",gap:10,alignItems:"center"}}><span style={{fontSize:12}}>Lots</span><input type="number" step="0.01" value={lots} onChange={e=>setLots(Number(e.target.value))} style={{width:90,background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:8,padding:8}} /></div>
     <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
       <div style={{background:"#0f172a",padding:12,borderRadius:8}}><div style={{color:"#94a3b8",fontSize:10}}>OPEN / PENDING</div><b style={{fontSize:18}}>{openTrades.length}</b></div>
       <div style={{background:"#0f172a",padding:12,borderRadius:8}}><div style={{color:"#94a3b8",fontSize:10}}>DAILY TRADES</div><b style={{fontSize:18}}>{orders.length+closed.length}/4</b></div>
       <div style={{background:"#0f172a",padding:12,borderRadius:8}}><div style={{color:"#94a3b8",fontSize:10}}>FLOATING P/L</div><b style={{color:"#4ade80"}}>${fmt(floating,2)}</b></div>
       <div style={{background:"#0f172a",padding:12,borderRadius:8}}><div style={{color:"#94a3b8",fontSize:10}}>REALISED P/L</div><b style={{color:"#4ade80"}}>${fmt(realised,2)}</b></div>
     </div>
     <button onClick={startRobot} disabled={running} style={{width:"100%",padding:15,marginTop:14,background:"#10b981",color:"white",border:"none",borderRadius:10,fontWeight:900,fontSize:15}}>▶ START ROBOT - ORANGE + RBD/DBR</button>
   </div>
   <div style={{background:"linear-gradient(135deg,#0f172a,#1e1b4b)",border:"1px solid #3b82f6",borderRadius:16,margin:12,padding:16}}>
     <div style={{display:"flex",justifyContent:"space-between",gap:8}}><div><div style={{fontSize:15,fontWeight:900}}>🤖 AI SCANNER 📸</div><div style={{fontSize:11,color:"#93c5fd",marginTop:4}}>Multi-Timeframe Enabled - M1 + M15 compare - Slope + RBD/DBR</div></div><div style={{background:"#14532d",color:"#4ade80",padding:"6px 10px",borderRadius:6,fontSize:11,fontWeight:800,textAlign:"center"}}>RE<br/>ON</div></div>
     <div style={{fontSize:12,marginTop:12}}>Pair: <b style={{color:"#4ade80"}}>{detectedPair||scanPair}</b> {isDetecting?"Detecting...":""} {ocrPrice?` • OCR Price: ${ocrPrice}`:""}</div>
     <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>{["XAUUSD","EURUSD","GBPUSD","BTCUSD","US30","NAS100","V75","GBPJPY","USDJPY","AUDUSD"].map(p=>(<button key={p} onClick={()=>{setScanPair(p); setDetectedPair("");}} style={{padding:"7px 14px",borderRadius:20,background:(detectedPair||scanPair)===p?"#16a34a":"#1e293b",color:"white",border:"none",fontSize:12,fontWeight:700}}>{p}</button>))}</div>
     <input value={scanPair} onChange={e=>{setScanPair(e.target.value.toUpperCase()); setDetectedPair("");}} style={{width:"100%",marginTop:10,background:"#1e293b",color:"white",border:"1px solid #475569",borderRadius:8,padding:10}} />
     <div style={{display:"flex",gap:8,marginTop:8}}>
       <input value={manualPrice} onChange={e=>setManualPrice(e.target.value)} placeholder="Optional: Type live price e.g. 4413.83 if scanner price still wrong" style={{flex:1,background:"#0f172a",color:"#fbbf24",border:"1px solid #f59e0b",borderRadius:8,padding:10,fontSize:12}} />
     </div>
     <div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>Tip: Upload M1 first, M15 second. {detectMsg}</div>
     <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:14}}>
       <div><div style={{fontSize:12,marginBottom:6}}>Chart 1 - {tf1}</div><label style={{display:"block",border:"1px dashed #3b82f6",borderRadius:8,padding:10,textAlign:"center",cursor:"pointer",background:"#131e32",minHeight:110,overflow:"hidden"}}>{c1?<img src={c1} style={{width:"100%",height:110,objectFit:"cover",borderRadius:6}}/>:<div style={{paddingTop:35,color:"#94a3b8"}}>+ Upload</div>}<input type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0],setC1)} style={{display:"none"}} /></label><select value={tf1} onChange={e=>setTf1(e.target.value)} style={{width:"100%",marginTop:8,background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:6,padding:8}}><option>M1</option><option>M5</option><option>M15</option><option>H1</option></select></div>
       <div><div style={{fontSize:12,marginBottom:6}}>Chart 2 - {tf2} (Boss)</div><label style={{display:"block",border:"1px dashed #475569",borderRadius:8,padding:10,textAlign:"center",cursor:"pointer",background:"#131e32",minHeight:110,overflow:"hidden"}}>{c2?<img src={c2} style={{width:"100%",height:110,objectFit:"cover",borderRadius:6}}/>:<div style={{paddingTop:35,color:"#94a3b8"}}>+ Upload</div>}<input type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0],setC2)} style={{display:"none"}} /></label><select value={tf2} onChange={e=>setTf2(e.target.value)} style={{width:"100%",marginTop:8,background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:6,padding:8}}><option>M15</option><option>M1</option><option>M5</option><option>H1</option></select></div>
     </div>
     <button onClick={analyze} style={{width:"100%",padding:14,marginTop:14,background:"#2563eb",color:"white",border:"none",borderRadius:8,fontWeight:900,fontSize:13}}>{scanning?"🔍 ANALYZING - COMPARING TIMEFRAMES...":"🔍 ANALYZE CHARTS - MULTI-TIMEFRAME"}</button>
     {result && (
       <div style={{background:"#0f172a",border:"1px solid #22c55e",borderRadius:10,padding:12,marginTop:12}}>
         <div style={{display:"flex",justifyContent:"space-between"}}><b>{result.pair}</b><div style={{background:result.dir==="BUY"?"#16a34a":"#dc2626",color:"white",padding:"6px 14px",borderRadius:6,fontWeight:900}}>{result.dir}</div></div>
         <div style={{fontSize:11,marginTop:6,background:"#1e293b",padding:8,borderRadius:6}}><b style={{color:"#93c5fd"}}>{result.strat}</b> - {result.detail||""}</div>
         <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginTop:12,textAlign:"center"}}>
           <div style={{background:"#1e293b",padding:10,borderRadius:8}}><div style={{fontSize:10,color:"#94a3b8"}}>ENTRY</div><b>{fmtPrice(result.entry, result.pair)}</b></div>
           <div style={{background:"#1e293b",padding:10,borderRadius:8}}><div style={{fontSize:10,color:"#94a3b8"}}>SL</div><b>{fmtPrice(result.sl, result.pair)}</b></div>
           <div style={{background:"#1e293b",padding:10,borderRadius:8}}><div style={{fontSize:10,color:"#fbbf24"}}>TAKE PROFIT</div><b style={{color:"#4ade80"}}>{fmtPrice(result.tp, result.pair)}</b></div>
         </div>
         <div style={{marginTop:10,fontSize:11,textAlign:"center"}}>Live Price: {fmtPrice(result.livePrice, result.pair)} • Confidence: <b style={{color:"#4ade80"}}>{result.conf}%</b> • Timeframe Alignment</div>
         <div style={{marginTop:8,display:"flex",gap:8,fontSize:10}}><div style={{flex:1,background:"#1e293b",padding:6,borderRadius:6,textAlign:"center"}}>{tf1}: {result.strat.includes("Bullish")?"Bullish":"Check"}</div><div style={{flex:1,background:"#1e293b",padding:6,borderRadius:6,textAlign:"center"}}>{tf2}: Boss Trend</div></div>
       </div>
     )}
   </div>
   <div style={{background:"#131e32",border:"1px solid #24334b",borderRadius:12,margin:12,padding:14}}>
     <button onClick={()=>setShowSignals(v=>!v)} style={{width:"100%",display:"flex",justifyContent:"space-between",background:"#0f172a",color:"white",border:"1px solid #334155",borderRadius:8,padding:13,fontSize:12,fontWeight:900}}><span>VALID M15 SIGNALS ({signals.length}) - ORANGE + RBD/DBR</span><span>{showSignals?"▲":"▼"}</span></button>
     {showSignals && signals.map((s,i)=>(
       <div key={i} style={{background:"#0f172a",border:"1px solid #334155",borderRadius:10,padding:12,marginTop:8}}>
         <div style={{display:"flex",justifyContent:"space-between"}}><b>{s.sym}</b><span style={{color:s.dir==="BUY"?"#4ade80":"#f87171",fontWeight:900}}>{s.dir} {s.strat}</span></div>
         <div style={{fontSize:11,color:"#94a3b8",margin:"6px 0"}}>Box {fmtPrice(s.boxHigh,s.sym)} / {fmtPrice(s.boxLow,s.sym)} • RSI {fmt(s.rsi,1)} • Entry {fmtPrice(s.entry,s.sym)}</div>
         <button onClick={()=>placeOrder(s)} style={{width:"100%",padding:10,background:"#f59e0b",color:"black",border:"none",borderRadius:8,fontWeight:900}}>PLACE PENDING {s.dir==="BUY"?"BUY STOP":"SELL STOP"} 🔔</button>
       </div>
     ))}
     {showSignals && signals.length===0 && <div style={{fontSize:12,color:"#8a9bb5",textAlign:"center",padding:16}}>No signals touching box right now.</div>}
   </div>
  </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
